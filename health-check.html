<title>逢甲大學 學系網站健檢儀表板 v6.0</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" integrity="sha384-hs5SINUk7GPohxRis+rS7grpSWEbtOIJ3sRoseBKg3CDPIKpG55RfSenbvA6ALOt" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC','Microsoft JhengHei',sans-serif;background:#f0efe9;color:#1a1a18;font-size:15px;line-height:1.5;}
.layout{display:flex;height:100vh;overflow:hidden;}

/* ── Sidebar ── */
.sb{width:250px;flex-shrink:0;overflow-y:auto;border-right:1px solid #dddcd4;background:#f7f6f1;display:flex;flex-direction:column;}
.sb-hdr{padding:.85rem 1rem .7rem;border-bottom:1px solid #dddcd4;flex-shrink:0;}
.sb-logo{display:flex;align-items:center;gap:8px;margin-bottom:.4rem;}
.sb-logo i{font-size:20px;color:#C8102E;}
.sb-t{font-size:14.5px;font-weight:700;color:#1a1a18;line-height:1.35;}
.sb-m{font-size:11.5px;color:#888780;margin-top:3px;line-height:1.6;}
.sb-btns{display:flex;flex-direction:column;gap:5px;margin-top:8px;}
.sb-btn{display:flex;align-items:center;gap:6px;width:100%;padding:6px 10px;font-size:12px;background:#fff;border:1px solid #d3d1c7;border-radius:7px;cursor:pointer;color:#534AB7;font-weight:600;text-decoration:none;transition:background .12s;}
.sb-btn:hover{background:#EEEDFE;border-color:#AFA9EC;}
.sb-btn.red{color:#C8102E;}
.sb-btn.red:hover{background:#fff0f2;border-color:#f5a0a8;}
.sb-btn-disabled{color:#b0adb8;cursor:default;background:#f7f6f1;border-color:#e2e0d8;}
.sb-btn-disabled:hover{background:#f7f6f1;border-color:#e2e0d8;}
.soon{font-size:10px;background:#e2e0d8;color:#888780;padding:1px 5px;border-radius:8px;margin-left:2px;}
.sb-body{flex:1;overflow-y:auto;padding-bottom:.75rem;}
.col-h{display:flex;align-items:center;gap:7px;margin-top:10px;padding:.45rem .9rem;font-size:12.5px;font-weight:800;color:#fff;background:linear-gradient(90deg,#C8102E 0%,#a00d26 100%);letter-spacing:.03em;}
.di{display:flex;align-items:center;gap:8px;padding:.35rem 1rem;cursor:pointer;color:#5F5E5A;border-left:3px solid transparent;transition:background .12s;}
.di:hover{background:rgba(0,0,0,.05);color:#1a1a18;}
.di.act{background:#fff;color:#C8102E;border-left-color:#C8102E;font-weight:700;}
.di-n{font-size:13px;line-height:1.35;flex:1;}
.di-score{font-size:11px;font-weight:800;padding:1px 7px;border-radius:10px;flex-shrink:0;min-width:20px;text-align:center;}
.sA{background:#dcfce7;color:#15803d;}
.sB{background:#dbeafe;color:#1d4ed8;}
.sC{background:#fee2e2;color:#b91c1c;}
.sP{background:#f1f5f9;color:#94a3b8;}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{display:flex;align-items:center;gap:8px;background:#fff;border-bottom:1px solid #dddcd4;padding:.6rem 1.4rem;flex-shrink:0;font-size:12.5px;color:#888780;flex-wrap:wrap;row-gap:4px;}
.topbar strong{color:#1a1a18;}
.tb-bar{width:110px;height:7px;background:#ebe9e0;border-radius:4px;overflow:hidden;flex-shrink:0;}
.tb-bar-f{height:100%;background:linear-gradient(90deg,#C8102E,#a00d26);border-radius:4px;transition:width .5s ease;}
.tb-grade-chip{font-size:11px;font-weight:800;padding:1px 8px;border-radius:10px;}
.mn{flex:1;overflow-y:auto;padding:1.1rem 1.4rem;background:#f0efe9;}
.empty{text-align:center;padding:5rem 2rem;color:#B4B2A9;font-size:14px;}
.empty i{font-size:28px;display:block;margin-bottom:.6rem;}

/* ── Cards ── */
.card{background:#fff;border-radius:12px;padding:1rem 1.2rem;margin-bottom:.8rem;border:1px solid #e5e4dc;}
.card-title{font-size:12px;font-weight:700;color:#888780;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.7rem;display:flex;align-items:center;gap:6px;}
.dept-hd{display:flex;align-items:flex-start;gap:14px;}
.score-circle{width:68px;height:68px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff;flex-shrink:0;line-height:1.05;}
.score-circle small{font-size:9px;font-weight:700;letter-spacing:.03em;opacity:.9;}
.dept-info h2{font-size:19px;font-weight:700;margin-bottom:3px;}
.dept-info .college-tag{font-size:11px;color:#C8102E;font-weight:700;margin-bottom:4px;}
.dept-info .url-link{font-size:12px;color:#185FA5;text-decoration:none;}
.dept-info .url-link:hover{text-decoration:underline;}
.dept-info .eval-date{font-size:11px;color:#888780;margin-top:2px;}
.pending-note{background:#f8fafc;border-radius:8px;padding:2.5rem;text-align:center;color:#94a3b8;font-size:13px;}

/* ── AB summary bars ── */
.ab-grid{display:flex;flex-direction:column;gap:10px;}
.ab-row{display:flex;align-items:center;gap:10px;}
.ab-label{font-size:13px;font-weight:700;width:150px;flex-shrink:0;}
.ab-bg{flex:1;background:#ebe9e0;border-radius:7px;height:14px;overflow:hidden;}
.ab-fill{height:100%;border-radius:7px;transition:width .5s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;}
.ab-val{font-size:11px;font-weight:700;color:#1a1a18;width:56px;text-align:right;flex-shrink:0;}

/* ── Dim bars ── */
.dim-grp-lbl{font-size:11px;font-weight:800;color:#C8102E;margin:10px 0 5px;letter-spacing:.04em;}
.dim-grp-lbl:first-child{margin-top:0;}
.dim-grid{display:flex;flex-direction:column;gap:6px;}
.dbar-row{display:flex;align-items:center;gap:8px;}
.dbar-name{font-size:12px;color:#5F5E5A;width:168px;flex-shrink:0;line-height:1.3;}
.dbar-bg{flex:1;background:#ebe9e0;border-radius:6px;height:9px;overflow:hidden;}
.dbar-fill{height:100%;border-radius:6px;transition:width .5s ease;}
.dbar-val{font-size:12px;font-weight:700;color:#1a1a18;width:42px;text-align:right;}

/* ── Two-col for radar+bars ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}

/* ── Radar ── */
.radar-wrap{display:flex;justify-content:center;}
.radar-wrap canvas{max-width:260px;max-height:260px;}

/* ── Lists ── */
.sec-lbl{font-size:11px;font-weight:700;color:#888780;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;display:flex;align-items:center;gap:4px;}
.item-list{list-style:none;display:flex;flex-direction:column;gap:6px;}
.item-list li{font-size:14px;padding:9px 12px 9px 32px;border-radius:8px;position:relative;line-height:1.65;}
.hl li{background:#f0fdf4;color:#166534;}
.hl li::before{content:'✓';position:absolute;left:10px;font-weight:700;color:#16a34a;}
.pl li{background:#fff1f2;color:#991b1b;}
.pl li::before{content:'⚠';position:absolute;left:9px;}
.fx{counter-reset:s}
.fx li{background:#fefce8;color:#78350f;counter-increment:s;}
.fx li::before{content:counter(s);position:absolute;left:10px;font-weight:800;color:#d97706;}
.pr li{background:#fef2f2;color:#7f1d1d;border:1px solid #fecaca;}
.pr li::before{content:'🚩';position:absolute;left:8px;font-size:12px;}

/* ── Per-page cards (two-col) ── */
.pages-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:900px){.pages-grid{grid-template-columns:1fr;}}
.page-card{background:#fff;border-radius:11px;border:1px solid #e5e4dc;overflow:hidden;}
.page-card-hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #e5e4dc;background:#f7f6f1;}
.page-card-name{font-size:13.5px;font-weight:700;flex:1;}
.ps{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:20px;padding:0 6px;border-radius:5px;font-size:10px;font-weight:700;color:#fff;background:#94a3b8;}
.page-card-body{padding:10px 14px;}
.page-note-text{font-size:13px;color:#374151;line-height:1.75;}
.pg-link{color:#185FA5;text-decoration:none;font-size:11px;margin-left:auto;flex-shrink:0;}
.pg-link:hover{text-decoration:underline;}

/* ── Rubric ── */
.ru-card{background:#f8fafc;border-radius:9px;padding:12px 14px;margin-bottom:10px;border-left:3px solid #C8102E;}
.ru-card h4{font-size:13px;font-weight:700;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;}
.ru-pts{font-size:10.5px;background:#C8102E;color:#fff;padding:2px 8px;border-radius:20px;}
.ru-card p{font-size:12px;color:#64748b;line-height:1.65;}
.excl-note{background:#fff8f0;border-radius:9px;padding:11px 14px;font-size:12px;color:#78350f;line-height:1.7;}
.imp-note{background:#fef2f2;border:1px solid #fecaca;border-radius:9px;padding:11px 14px;font-size:12px;color:#991b1b;line-height:1.8;margin-bottom:10px;}
.imp-note ul{margin:4px 0 0 18px;}
.ru-tbl{width:100%;border-collapse:collapse;margin-top:6px;font-size:11.5px;}
.ru-tbl th{background:#eef1f5;color:#475569;font-weight:700;text-align:left;padding:5px 8px;border:1px solid #e2e8f0;}
.ru-tbl td{padding:5px 8px;border:1px solid #e2e8f0;color:#475569;vertical-align:top;line-height:1.6;}
.ru-tbl td:first-child,.ru-tbl th:first-child{white-space:nowrap;}
.ru-sub{font-size:11px;color:#94a3b8;margin-top:6px;line-height:1.6;}
.grade-tbl td.gA{color:#15803d;font-weight:800;}
.grade-tbl td.gB{color:#1d4ed8;font-weight:800;}
.grade-tbl td.gC{color:#b91c1c;font-weight:800;}

/* ── Mobile ── */
.hb-btn{display:none;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid #d3d1c7;border-radius:8px;background:#fff;cursor:pointer;color:#1a1a18;font-size:18px;flex-shrink:0;}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;}
.sb-overlay.show{display:block;}
.sb-close{display:none;}
@media(max-width:768px){
  .hb-btn{display:inline-flex;}
  .sb{position:fixed;top:0;left:-86vw;width:82vw;max-width:320px;height:100vh;z-index:60;box-shadow:2px 0 18px rgba(0,0,0,.3);transition:left .25s ease;}
  .sb.open{left:0;}
  .sb-close{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border:none;background:#ebe9e0;border-radius:6px;cursor:pointer;color:#5F5E5A;font-size:14px;margin-left:auto;}
  .topbar{flex-wrap:wrap;padding:.55rem .8rem;row-gap:6px;}
  .tb-bar{width:70px;}
  .mn{padding:.85rem .7rem;}
  .card{padding:.85rem .9rem;border-radius:10px;}
  .dept-hd{flex-wrap:wrap;gap:10px;}
  .score-circle{width:54px;height:54px;font-size:20px;}
  .dept-info h2{font-size:16.5px;}
  .dbar-name{width:128px;font-size:11px;}
  .dbar-val{width:34px;}
  .ab-label{width:110px;font-size:12px;}
  .ru-tbl{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;}
  .ru-tbl thead,.ru-tbl tbody,.ru-tbl tr{display:table;width:100%;table-layout:fixed;}
  .item-list li{font-size:13.5px;padding:8px 10px 8px 30px;}
  .page-card-hd{flex-wrap:wrap;}
  .radar-wrap canvas{max-width:200px;max-height:200px;}
}

/* ── Tabs ── */
.tabs{display:flex;gap:2px;border-bottom:2px solid #e5e4dc;margin-bottom:1rem;}
.tab{padding:8px 14px;border:none;background:none;cursor:pointer;font-size:12.5px;font-weight:700;color:#888780;border-bottom:2.5px solid transparent;margin-bottom:-2px;transition:all .12s;}
.tab.on{color:#C8102E;border-bottom-color:#C8102E;}
.tab-panel{display:none;}
.tab-panel.on{display:block;}
</style>
</head>
<body>

<script>
/* ═══════════════════════════════════════════════════════
   DATA — v6.0（文字內容60分＋圖片／影像內容40分＝100分，
   總分只轉換為等級 A(81–100)／B(61–80)／C(0–60) 對外呈現，
   不顯示原始總分數字；子項細分仍保留分數以利具體改善追蹤。
═══════════════════════════════════════════════════════ */
const SUBS = [
  {id:'a1', name:'A1 特色與核心內容完整度', max:20, grp:'A'},
  {id:'a2', name:'A2 文案轉譯品質',        max:20, grp:'A'},

  {id:'a5', name:'A5 招生與聯絡資訊正確性', max:3,  grp:'A'},

  {id:'b1', name:'B1 真實性與學系關聯',    max:10, grp:'B'},
  {id:'b2', name:'B2 教學與學生學習情境',  max:10, grp:'B'},
  {id:'b3', name:'B3 成果與專業能力呈現',  max:7,  grp:'B'},
  {id:'b4', name:'B4 影像清晰度與可辨識性', max:9,  grp:'B'},
  {id:'b5', name:'B5 師資照片完整性',      max:4,  grp:'B'},
];

const DEPTS = [
/* ── 工程與科學學院 ── */
{
  id:'inde', college:'工程與科學學院', name:'工業工程與系統管理學系',
  url:'https://inde.fcu.edu.tw/', eval_date:'2026-08-10（v6.0，首頁＋一二層選單全部頁面逐頁檢視；圖片以下載樣本目視確認真偽，未能截圖之項目標記待人工複核）；2026-08-11（首輪為首頁頂層導覽掃描；同日以首頁全連結掃描複查補齊6項先前遺漏之次級導覽頁）',
  evaluated:true,
  overall:62, a1:11, a2:13, a3:6, a4:4, a5:3, a6:2, b1:5, b2:5, b3:3, b4:6, b5:4,
  priority_issues:[
    '特色實驗室僅列出1個（からくり實作道場），未達標準「至少2個代表性實驗室」門檻，且配圖之一為WordPress主題預設佔位圖',
  ],
  highlights:[
    'CDIO三專題（新鮮人專題／深碗課程／畢業專題）、IEET 2024國際認證、跨系雙主修（工工+資訊/統計/會計）等≥3項具本系專屬性特色，明確可辨識',
    'freshman_project／graduation_project頁經下載樣本目視確認為真實課堂與專題實作照片，非圖庫',
    '招生管道（學士班／碩博士班）全數正確連往www.fcu.edu.tw/recurit_list/官方頁，比對白名單無誤',

    '首頁meta description為「111學年度大學申請入學書審準備重點指引」，與首頁內容完全無關的過期殘留；其餘內頁description多數缺漏',

/* ═══════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════ */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function safeUrl(u){u=String(u==null?'':u);return /^https?:\/\//i.test(u)?u:'#';}
/* 新版三等級：A 81–100 ／ B 61–80 ／ C 0–60（只對外呈現字母等級，不呈現原始總分數字） */
function gradeKey(s){return s>=81?'A':s>=61?'B':'C';}
function gradeColor(s){return s>=81?'#16a34a':s>=61?'#2563eb':'#dc2626';}
function gradeLabel(s){return s>=81?'A級':s>=61?'B級':'C級';}
function pct(v,mx){return Math.round(v/mx*100);}

/* ═══════════════════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════════════════ */
let radarChart = null;

function buildSidebar(){
  const body = document.getElementById('sb-body');
  const colleges = [...new Set(DEPTS.map(d=>d.college))];
  colleges.forEach(col=>{
    const depts = DEPTS.filter(d=>d.college===col);
    const hdr = document.createElement('div');
    hdr.className='col-h'; hdr.textContent=col;
    body.appendChild(hdr);
    depts.forEach(d=>{
      const el = document.createElement('div');
      el.className='di'; el.id='di-'+d.id;
      const scoreHtml = d.evaluated
        ? `<span class="di-score s${gradeKey(d.overall)}">${gradeKey(d.overall)}</span>`
        : `<span class="di-score sP">—</span>`;
      el.innerHTML=`<div class="di-n">${esc(d.name)}</div>${scoreHtml}`;
      el.onclick=()=>selectDept(d.id);
      body.appendChild(el);
    });
  });
}

/* ═══════════════════════════════════════════════════════
   TOPBAR
═══════════════════════════════════════════════════════ */
function updateTopbar(){
  const evaled = DEPTS.filter(d=>d.evaluated);
  const counts = {A:0,B:0,C:0};
  evaled.forEach(d=>counts[gradeKey(d.overall)]++);
  document.getElementById('tb-evaled').textContent = evaled.length;
  document.getElementById('tb-total').textContent  = DEPTS.length;
  document.getElementById('tb-bar-f').style.width  = (DEPTS.length?Math.round(evaled.length/DEPTS.length*100):0)+'%';
  const gradesEl = document.getElementById('tb-grades');
  gradesEl.innerHTML = evaled.length
    ? `<span class="tb-grade-chip sA" style="margin-right:4px;">A ${counts.A}</span><span class="tb-grade-chip sB" style="margin-right:4px;">B ${counts.B}</span><span class="tb-grade-chip sC">C ${counts.C}</span>`
    : '—';
}

/* ═══════════════════════════════════════════════════════
   SELECT DEPT
═══════════════════════════════════════════════════════ */
function selectDept(id){
  document.querySelectorAll('.di').forEach(e=>e.classList.remove('act'));
  const el = document.getElementById('di-'+id);
  if(el) el.classList.add('act');
  closeSidebar();
  const d = DEPTS.find(x=>x.id===id);
  if(!d) return;
  d.evaluated ? renderEvaluated(d) : renderPending(d);
}

    <div class="dept-hd">

        <div class="college-tag">${esc(d.college)}</div>
        <h2>${esc(d.name)}</h2>
        <a class="url-link" href="${esc(safeUrl(d.url))}" target="_blank" rel="noopener noreferrer">${esc(d.url)} ↗</a>
        <div class="eval-date">尚未依 v6.0 標準進行健檢</div>
      </div>

  </div>`;
}

      responsive:true,
      scales:{r:{beginAtZero:true,max:100,ticks:{stepSize:25,font:{size:8}},pointLabels:{font:{size:9}}}},
      plugins:{legend:{display:false}}
    }
  });
}

function switchTab(i){
  document.querySelectorAll('.tab').forEach((b,idx)=>b.classList.toggle('on',idx===i));
  document.querySelectorAll('.tab-panel').forEach((p,idx)=>p.classList.toggle('on',idx===i));
}

function openSidebar(){
  document.getElementById('sb').classList.add('open');
  document.getElementById('sb-overlay').classList.add('show');
}
function closeSidebar(){
  document.getElementById('sb').classList.remove('open');
  document.getElementById('sb-overlay').classList.remove('show');
}

document.addEventListener('DOMContentLoaded',()=>{
  buildSidebar();
  updateTopbar();
  document.getElementById('hb-btn').onclick=openSidebar;
  document.getElementById('sb-close-btn').onclick=closeSidebar;
  document.getElementById('sb-overlay').onclick=closeSidebar;
});
</script>
</body>
</html>
