<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;background:#f0efe9;color:#1a1a18;font-size:22.1px;line-height:1.5;}
.layout{display:flex;height:100vh;}

/* ── Sidebar ── */
.sb{width:256px;flex-shrink:0;overflow-y:auto;border-right:1px solid #dddcd4;background:#f7f6f1;display:flex;flex-direction:column;}
.sb-hdr{padding:1rem 1.1rem .75rem;border-bottom:1px solid #dddcd4;flex-shrink:0;}
.sb-logo{display:flex;align-items:center;gap:9px;margin-bottom:.5rem;}
.sb-logo i{font-size:28.6px;color:#534AB7;}
.sb-t{font-size:20.8px;font-weight:700;color:#1a1a18;line-height:1.3;}
.sb-m{font-size:16.2px;color:#888780;margin-top:4px;line-height:1.65;}
.sb-btn{display:block;width:100%;margin-top:9px;padding:7px 0;font-size:16.9px;background:#fff;border:1px solid #d3d1c7;border-radius:7px;cursor:pointer;color:#534AB7;font-weight:600;}
.sb-btn:hover{background:#EEEDFE;border-color:#AFA9EC;}
.sb-body{flex:1;overflow-y:auto;padding-bottom:.75rem;}
.col-h{padding:.6rem 1.1rem .2rem;font-size:15.6px;font-weight:700;color:#888780;text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}
.di{display:flex;align-items:center;gap:8px;padding:.4rem 1.1rem;cursor:pointer;color:#5F5E5A;border-left:3px solid transparent;transition:background .12s;}
.di:hover{background:rgba(0,0,0,.05);color:#1a1a18;}
.di.act{background:#fff;color:#185FA5;border-left-color:#185FA5;font-weight:700;}
.di-n{font-size:19.5px;line-height:1.35;}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

/* ── Main area ── */
.mn{flex:1;overflow-y:auto;padding:1.25rem 1.6rem;background:#f0efe9;}
.card{background:#fff;border-radius:12px;padding:1.1rem 1.4rem;margin-bottom:.9rem;border:1px solid #e5e4dc;}
.dn{font-size:28.6px;font-weight:700;color:#1a1a18;}
.ds{font-size:16.9px;color:#888780;margin-top:4px;}
.ds a{color:#185FA5;text-decoration:none;}
.ds a:hover{text-decoration:underline;}
.ubdg{display:inline-block;font-size:16.2px;padding:4px 13px;background:#EAF3DE;color:#3B6D11;border-radius:99px;margin-top:7px;font-weight:600;}

/* ── Stat grid ── */
.sg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:.9rem;}
.sc{background:#fff;border-radius:10px;padding:.8rem .6rem;text-align:center;border:1px solid #e5e4dc;}
.sv{font-size:36.4px;font-weight:700;line-height:1.1;}
.sl{font-size:16.2px;color:#888780;margin-top:5px;line-height:1.4;}

/* ── Progress bar ── */
.pb-r{display:flex;justify-content:space-between;font-size:17.6px;color:#5F5E5A;margin-bottom:.45rem;}
.pb-bg{height:15px;background:#ebe9e0;border-radius:8px;overflow:hidden;}
.pb-f{height:100%;border-radius:8px;background:#E9A23B;transition:width .6s ease;}
.pb-n{font-size:16.9px;color:#5F5E5A;margin-top:.4rem;}

/* ── Table ── */
.tbl-wrap{background:#fff;border-radius:12px;overflow:clip;border:1px solid #e5e4dc;}
.tbl-hdr{padding:.7rem 1.2rem;background:#f7f6f1;border-bottom:1px solid #e5e4dc;font-size:18.2px;font-weight:700;color:#1a1a18;display:flex;align-items:center;gap:8px;}
table{width:100%;border-collapse:collapse;font-size:18.9px;}
th{padding:.55rem 1rem;font-size:16.9px;font-weight:700;color:#888780;text-align:left;border-bottom:1px solid #e5e4dc;background:#f7f6f1;position:sticky;top:0;z-index:2;}
td{padding:.6rem 1rem;border-bottom:1px solid #eceae0;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#faf9f6;}
.ttl{color:#1a1a18;cursor:pointer;line-height:1.45;font-size:18.9px;}
.ttl:hover{color:#185FA5;text-decoration:underline;}
.gb{display:inline-block;font-size:16.2px;padding:3px 10px;border-radius:6px;font-weight:700;}
.gg{background:#EAF3DE;color:#3B6D11;}
.gn{background:#FAEEDA;color:#854F0B;}
.gw{background:#FAECE7;color:#993C1D;}
.gp{background:#FCEBEB;color:#A32D2D;}

/* ── Score bars ── */
.sbrs{display:flex;flex-direction:column;gap:4px;min-width:130px;}
.sbr{display:flex;align-items:center;gap:5px;}
.sbl{font-size:15px;color:#888780;width:60px;}
.sbb{flex:1;height:8px;background:#ebe9e0;border-radius:4px;overflow:hidden;}
.sbf{height:100%;border-radius:4px;}
.sbv{font-size:15px;color:#5F5E5A;width:26px;text-align:right;}
.stot{font-size:26px;font-weight:800;color:#854F0B;min-width:36px;text-align:right;}

/* ── Misc ── */
.empty{text-align:center;padding:4rem;color:#B4B2A9;font-size:19.5px;}
.legend{display:flex;gap:14px;margin-bottom:.9rem;flex-wrap:wrap;}
.leg-i{display:flex;align-items:center;gap:6px;font-size:16.9px;color:#5F5E5A;}
.topbar{display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid #dddcd4;padding:.7rem 1.6rem;flex-shrink:0;font-size:16.9px;color:#888780;}
.topbar strong{color:#1a1a18;font-size:19.5px;}

/* ── 手機版（≤768px）：側欄化為抽屜、表格橫向滑動、間距縮小 ── */
.sb-toggle{display:none;}
.sb-backdrop{display:none;}
.swipe-hint{display:none;}
.nn-lbl{display:none;}
.more-btn{display:none;}
.to-top{display:none;}
@media (max-width:768px){
  body{font-size:19.5px;}
  .layout{height:100dvh;}
  .sb{position:fixed;top:0;left:0;bottom:0;z-index:60;width:min(80vw,280px);transform:translateX(-105%);transition:transform .25s ease;box-shadow:4px 0 18px rgba(0,0,0,.18);}
  .sb.open{transform:none;}
  .sb.open+.sb-backdrop{display:block;position:fixed;inset:0;z-index:55;background:rgba(20,20,18,.4);}
  .sb-toggle{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid #d3d1c7;border-radius:8px;background:#fff;color:#1a1a18;font-size:23.4px;cursor:pointer;flex-shrink:0;}
  .topbar{padding:.5rem .7rem;font-size:14.3px;gap:6px;flex-wrap:nowrap;overflow:hidden;white-space:nowrap;}
  /* 手機版只保留統計起迄，其餘資訊在各頁內已有 */
  .topbar span:nth-child(n+4){display:none;}
  .mn{padding:.8rem .7rem;}
  .card{padding:.9rem .8rem;}
  .dn{font-size:23.4px;}
  .sg{grid-template-columns:repeat(2,1fr)!important;gap:7px;}
  .sc{padding:.6rem .4rem;}
  .card>div[style*="repeat(4,1fr)"]{grid-template-columns:repeat(2,1fr)!important;}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .tbl-wrap table{min-width:680px;}
  table{font-size:16.2px;}
  th,td{padding:.45rem .55rem;font-size:16.2px;}
  .tbl-hdr{padding:.6rem .8rem;font-size:16.2px;}
  .sbl{width:52px;font-size:13.7px;}
  .sbrs{min-width:110px;}
  .sg-swipe{display:flex!important;clear:both;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:8px;padding-bottom:2px;scroll-snap-type:x proximity;scrollbar-width:none;-ms-overflow-style:none;}
  .sg-swipe::-webkit-scrollbar{display:none;}
  .sg-swipe .sc{flex:0 0 44%;min-width:132px;scroll-snap-align:start;}
  .sg-ga4 .sc-users{display:none;}
  .swipe-hint{display:flex;clear:both;justify-content:flex-end;align-items:center;gap:3px;font-size:13.7px;color:#B4B2A9;margin:2px 0 4px;}
  .legend{gap:6px 10px;font-size:13.7px;margin-bottom:.6rem;}
  .leg-i{white-space:nowrap;}
  /* 觸控目標放大至 44px 建議值 */
  .sb .di{padding-top:.5rem;padding-bottom:.5rem;min-height:44px;}
  .sb-btn{padding:11px 0;min-height:44px;}
  /* 分批顯示按鈕 */
  .more-btn{display:block;width:100%;padding:12px;min-height:44px;border:none;border-top:1px solid #eceae0;background:#faf9f6;color:#185FA5;font-size:16.9px;font-weight:600;cursor:pointer;}
  .more-btn:disabled{color:#B4B2A9;}
  /* 回頂按鈕 */
  .to-top{position:fixed;right:14px;bottom:18px;width:44px;height:44px;border-radius:50%;border:1px solid #d3d1c7;background:#fff;color:#185FA5;font-size:24.7px;box-shadow:0 2px 10px rgba(0,0,0,.16);display:none;align-items:center;justify-content:center;z-index:50;cursor:pointer;}
  .to-top.show{display:flex;}
  /* ── 表格轉卡片式堆疊（熱門/冷門新聞、校級新聞列表）── */
  /* 卡片式列表不需橫向捲動；保留 overflow 會使 overflow-y 變 hidden，吸頂標題失效 */
  .tbl-stack{overflow:visible!important;}
  .tbl-stack table{display:block!important;min-width:0!important;}
  .tbl-stack thead{display:none;}
  .tbl-stack tbody{display:block;}
  .tbl-stack tr{display:block;padding:.6rem .8rem;border-bottom:1px solid #eceae0;}
  .tbl-stack tr:last-child{border-bottom:none;}
  .tbl-stack td{display:inline;border:none!important;padding:0!important;text-align:left!important;white-space:normal!important;background:none!important;}
  .tbl-stack .stk-rk{color:#B4B2A9;font-size:14.3px;}
  .tbl-stack .stk-rk::after{content:'.';margin-right:4px;}
  .tbl-stack .stk-ttl{font-size:17.6px;font-weight:600;color:#1a1a18;}
  .tbl-stack .stk-ttl a{color:inherit;}
  .tbl-stack .stk-ttl::after{content:'';display:block;height:4px;}
  .tbl-stack .stk-date{font-size:15px;color:#888780;}
  .tbl-stack .stk-date::before{content:'發佈 ';color:#B4B2A9;}
  .tbl-stack .stk-nn{margin-left:8px;}
  /* 各學系總覽：卡片式，系名一行、數字一行、燈號固定右上 */
  .ov-stack tr{position:relative;padding-right:2rem;}
  .ov-stack .ov-name{font-size:17.6px;font-weight:600;color:#1a1a18;}
  .ov-stack .ov-name::after{content:'';display:block;height:5px;}
  .ov-stack .ov-n::before{content:'新聞 ';color:#888780;font-size:14.3px;font-weight:400;}
  .ov-stack .ov-sch::before{content:'\3000校網 ';color:#888780;font-size:14.3px;font-weight:400;}
  .ov-stack .ov-self::before{content:'\3000自建 ';color:#888780;font-size:14.3px;font-weight:400;}
  .ov-stack .ov-nn::before{content:'\3000非新聞 ';color:#888780;font-size:14.3px;font-weight:400;}
  .ov-stack .ov-dot{position:absolute;right:.8rem;top:.75rem;}
  /* 三類列表以色帶區分，捲動時容易辨識目前所在區塊 */
  .sec-hot .tbl-hdr{background:#EDF7F3;border-left:4px solid #1D9E75;color:#0F6E56;}
  .sec-cold .tbl-hdr{background:#FDF0EE;border-left:4px solid #E24B4A;color:#993C1D;}
  .sec-news .tbl-hdr{background:#EEEDFE;border-left:4px solid #534AB7;color:#3F3899;}
  .sec-hot,.sec-cold,.sec-news{border-radius:12px;}
  .sec-cold,.sec-news{margin-top:1.1rem;}
  /* 區塊標題捲動時吸附在頂端 */
  .sec-hot .tbl-hdr,.sec-cold .tbl-hdr,.sec-news .tbl-hdr{position:sticky;top:0;z-index:3;}
  .tbl-stack .nn-lbl{display:inline;color:#E24B4A;font-size:14.3px;font-weight:700;margin-left:5px;vertical-align:middle;}
  .tbl-stack .stk-pv{font-size:15.6px;font-weight:700;margin-left:12px;}
  .tbl-stack .stk-pv::before{content:'瀏覽 ';color:#B4B2A9;font-size:15px;font-weight:400;}
  .tbl-stack .stk-pv::after{content:' 次';color:#B4B2A9;font-size:15px;font-weight:400;}
  .tbl-stack .stk-tags{display:block;margin-top:4px;max-width:none!important;}
  .tbl-stack .stk-tags span{margin:2px 4px 2px 0!important;padding:1px 6px!important;font-size:14.3px!important;}
  .tbl-stack .stk-grade{display:block;margin-top:4px;}
  .tbl-stack .stk-badge{margin-right:8px;}
  .tbl-stack .stk-score{display:block;margin-top:3px;}
  .tbl-stack .stk-score-inner{justify-content:flex-start!important;flex-wrap:wrap;row-gap:4px;}
  .tbl-stack .sbrs{width:auto;min-width:0!important;flex:1 1 auto;}
  .tbl-stack .sbl{width:52px!important;font-size:13.7px!important;}
}
</style>

const TYPE_RULES={
'新聞稿':`▍新聞稿寫法
- 以高等教育工作者的程度與角度撰寫，使用正式但易讀的學術新聞英文，避免口語化，也避免過度生硬的官方公文體，符合國際大學新聞稿的慣用語氣與寫作風格。
- 第一行為英文標題（原文無標題時，依內容擬定）。
- 導言先交代最重要的人、事、時、地；中文重複的修辭與口號可精簡，但不得刪去任何事實。
- 引述須保留原意，並清楚標明說話者。`,
'活動':`▍活動訊息寫法
- 語氣正式但親切，可以用 you 直接對讀者說話，讓國際學生與外籍人士願意參加。
- 結構：英文標題 → 1–2 段活動介紹（目的、亮點、適合對象）→ 活動資訊。
- 活動資訊以「項目: 內容」逐行列出，例如 Date、Time、Venue、Speaker、Eligibility、Registration、Deadline、Contact，只列出原文有的項目。
- 原文有報名方式時，結尾以一句話提醒讀者報名並附上期限。`,
'公告':`▍公告寫法
- 語氣清楚、精確、中性，不加任何宣傳性修辭。
- 結構：英文標題（直接說明公告事項）→ 首段說明公告目的與適用對象 → 規定、流程與應備文件。
- 規定、流程與應備文件依原文順序以 1. 2. 3. 編號列出，每一條都必須完整保留，不可合併或省略。
- 精確反映原文的強制程度：「應、須、必須」譯為 must 或 are required to；「得、可」譯為 may；「不得」譯為 may not 或 must not。`
};

function buildPromptText(content,type,glossaryLines,nameLines){
  const label=type==='auto'?'稿件':(type==='活動'?'活動訊息':type);
  const typeLine=type==='auto'
    ?'文件類型：請先依內容判斷屬於新聞稿、活動訊息或公告，再採用下方對應的寫法。'
    :`文件類型：${label}`;
  const rules=type==='auto'?Object.values(TYPE_RULES).join('\n\n'):TYPE_RULES[type];
  return `你是一位具備高等教育背景的專業翻譯人員，熟悉國際大學對外英文溝通的寫作慣例。請將以下逢甲大學中文${label}翻譯成適合國際讀者（國際學生、外籍教職員、海外姊妹校與校友）閱讀的英文${label}。

${typeLine}

【翻譯原則】
1. 專有名詞優先：以下是從逢甲大學官方雙語詞彙庫中比對到、本篇文章內出現的專有名詞（單位組織、人事、職稱、建築物等），翻譯時「必須」採用以下對照表的英文版本，不可自行另譯：
${glossaryLines||'（本文未比對到詞彙庫中的專有名詞）'}

2. 對照表使用補充：
   - 長短詞條重疊時（例如「副校長」與「校長」），以原文實際出現的完整詞為準。
   - Dean、Director、Chief 等通用職稱，須寫出所屬單位，例如教務長寫成 Dean of the Office of Academic Affairs（單位名稱同樣以對照表為準）。

3. 事實零誤差：人名、職稱、數字、日期、時間、地點、金額、名額、資格條件與截止期限必須與原文完全一致，不得增刪、推測或補充原文沒有的資訊。

4. 若文中出現詞彙庫未列出的人名、職稱或單位名稱，請依英文新聞慣例合理翻譯（人名可用漢語拼音，格式與對照表一致：名在前、姓在後，雙字名以連字號連接，例如 Cheng-Shu Kao；原文已附英文名者以原文為準），並維持全文用語前後一致。

5. 活動、計畫、競賽與獎項的正式名稱：

   - 同一名稱在全文只需在第一次出現時標示。一般性的描述（例如「新生典禮」「演講」）不需標示。

function buildTranslatorPrompt(){
  const content=document.getElementById('tContent').value.trim();
  if(content.length<5){
    alert('請貼上中文新聞稿／活動訊息／公告內容');
    return;
  }

  // 比對詞彙庫：找出文章中出現的所有詞條（同一中文詞若有多個官方英文版本，全部保留）
  const matchedMap=new Map();
  GLOSSARY.forEach(g=>{
    if(g.zh.length>=2&&content.includes(g.zh)){
      if(!matchedMap.has(g.zh))matchedMap.set(g.zh,new Set());
      matchedMap.get(g.zh).add(g.cat+'｜'+g.en);
    }
  });
  const matches=[...matchedMap.entries()]
    .sort((a,b)=>b[0].length-a[0].length)
    .map(([zh,set])=>({zh,variants:[...set].map(s=>s.split('｜'))}));

  const matchCard=document.getElementById('tMatchCard');
  const matchList=document.getElementById('tMatchList');
  if(matches.length){
    matchList.innerHTML=matches.map(m=>{
      const ens=m.variants.map(v=>v[1]).join('／');
      return `<div style="margin-bottom:4px;"><strong>${esc(m.zh)}</strong> → ${esc(ens)}</div>`;
    }).join('');
  } else {
    matchList.innerHTML='<span style="color:#B4B2A9;">未比對到詞彙庫中的專有名詞</span>';
  }
  matchCard.style.display='block';

  const glossaryLines=matches.map(m=>{
    const ens=m.variants.map(v=>v[1]);
    const enText=ens.length>1?(ens.join('／')+'（官方詞彙庫有多個版本，請依文意選用最合適者）'):ens[0];
    return m.zh+' = '+enText;
  }).join('\n');

  // 上稿者提供的活動／計畫正式英譯：每行「中文 = 英文」（全形＝也可）
  const nameLines=document.getElementById('tNames').value.split('\n')
    .map(l=>l.replace('＝','=').split('=').map(s=>s.trim()))
    .filter(p=>p.length===2&&p[0]&&p[1])
    .map(p=>p[0]+' = '+p[1]).join('\n');

  const prompt=buildPromptText(content,document.getElementById('tType').value,glossaryLines,nameLines);

  document.getElementById('tOutput').value=prompt;
  document.getElementById('tOutputCard').style.display='block';
  document.getElementById('tOutputCard').scrollIntoView({behavior:'smooth',block:'start'});
}

function copyTranslatorPrompt(){
  const ta=document.getElementById('tOutput');
  ta.select();
  navigator.clipboard?.writeText(ta.value).then(()=>{
    const msg=document.getElementById('tCopyMsg');
    msg.style.display='block';
    setTimeout(()=>msg.style.display='none',2500);
  }).catch(()=>{
    document.execCommand('copy');
  });
}
render();
</script>
</body>
